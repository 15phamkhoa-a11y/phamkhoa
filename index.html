<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phạm Khoa Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body.show-content .welcome-screen {
            opacity: 0;
            pointer-events: none;
        }

        body.show-content .container {
            opacity: 1;
        }

        .welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease;
        }

        .welcome-content {
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .welcome-content:hover {
            transform: scale(1.05);
        }

        .welcome-text {
            font-size: 3em;
            color: #fff;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { 
                text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
                transform: scale(1);
            }
            50% { 
                text-shadow: 0 0 40px rgba(255, 255, 255, 0.8);
                transform: scale(1.02);
            }
        }

        .welcome-hint {
            font-size: 1.2em;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 20px;
            animation: fade-in-out 2s ease-in-out infinite;
        }

        @keyframes fade-in-out {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { 
                opacity: 0.1;
                transform: scale(1);
            }
            50% { 
                opacity: 1;
                transform: scale(1.5);
            }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 700px;
            width: 100%;
            opacity: 0;
            transition: opacity 0.8s ease 0.5s, transform 0.3s ease;
            transform-style: preserve-3d;
        }

        .container:hover {
            transform: perspective(1000px);
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 30px;
            align-items: center;
            animation: slideIn 0.8s ease-out;
            transition: transform 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .left-section {
            flex-shrink: 0;
        }

        .profile-image-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
        }

        .profile-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
            animation: float 3s ease-in-out infinite;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .profile-image:hover {
            transform: scale(1.05);
            border-color: rgba(255, 255, 255, 0.6);
        }

        .profile-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.3s ease;
        }

        .profile-image.status-online {
            box-shadow: 0 0 30px rgba(67, 181, 129, 0.6);
            border-color: rgba(67, 181, 129, 0.5);
        }

        .profile-image.status-idle {
            box-shadow: 0 0 30px rgba(250, 166, 26, 0.6);
            border-color: rgba(250, 166, 26, 0.5);
        }

        .profile-image.status-dnd {
            box-shadow: 0 0 30px rgba(240, 71, 71, 0.6);
            border-color: rgba(240, 71, 71, 0.5);
        }

        .profile-image.status-offline {
            box-shadow: 0 0 30px rgba(116, 127, 141, 0.6);
            border-color: rgba(116, 127, 141, 0.5);
            filter: grayscale(50%);
        }

        .profile-image.status-offline img {
            filter: grayscale(30%);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .status-indicator {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 25px;
            height: 25px;
            background: #43b581;
            border-radius: 50%;
            border: 3px solid #000;
            z-index: 2;
            transition: all 0.3s ease;
        }

        .status-indicator::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            border-radius: 50%;
            animation: status-pulse 2s ease-in-out infinite;
        }

        @keyframes status-pulse {
            0%, 100% { 
                box-shadow: 0 0 0 0 currentColor;
                opacity: 0.7;
            }
            50% { 
                box-shadow: 0 0 0 8px currentColor;
                opacity: 0;
            }
        }

        .status-indicator.online {
            background: #43b581;
            color: #43b581;
        }

        .status-indicator.idle {
            background: #faa61a;
            color: #faa61a;
        }

        .status-indicator.idle::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background: #000;
            border-radius: 50% 50% 50% 0;
            transform: translate(-40%, -40%) rotate(-45deg);
        }

        .status-indicator.dnd {
            background: #f04747;
            color: #f04747;
        }

        .status-indicator.dnd::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 2.5px;
            background: #000;
            border-radius: 2px;
        }

        .status-indicator.offline {
            background: #747f8d;
            color: #747f8d;
        }

        .status-indicator.offline::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            border: 2.5px solid #000;
            border-radius: 50%;
            background: transparent;
        }

        .right-section {
            flex: 1;
        }

        .profile-header h1 {
            font-size: 2em;
            margin-bottom: 8px;
            color: #fff;
            text-shadow: 2px 2px 10px rgba(255, 255, 255, 0.3);
            font-family: monospace;
            overflow: hidden;
            border-right: 3px solid #fff;
            white-space: nowrap;
            animation: typing 6s steps(12) infinite, blink 0.75s step-end infinite;
        }

        @keyframes typing {
            0% { width: 0; }
            40% { width: 100%; }
            60% { width: 100%; }
            100% { width: 0; }
        }

        @keyframes blink {
            50% { border-color: transparent; }
        }

        .subtitle {
            font-size: 1em;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 15px;
        }

        .username {
            font-size: 1.1em;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 8px;
        }

        .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.75em;
            margin-left: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .social-icons {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .social-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 18px;
            color: #fff;
        }

        .social-icon:hover {
            transform: translateY(-5px);
            border-color: #fff;
            box-shadow: 0 5px 20px rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.1);
        }

        .info-item {
            color: rgba(255, 255, 255, 0.8);
            margin: 6px 0;
            font-size: 0.95em;
        }

        .info-item i {
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .info-item .fa-heart {
            color: rgba(255, 100, 100, 0.8);
        }

        .info-item .fa-heart:hover {
            color: #ff6b6b;
            transform: scale(1.2);
        }

        .info-item .fa-heart.liked {
            color: #ff6b6b;
            animation: heart-beat 0.5s ease;
        }

        @keyframes heart-beat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.3); }
            50% { transform: scale(1.1); }
        }

        .info-item .fa-eye {
            color: rgba(100, 150, 255, 0.8);
        }

        .discord-widget {
            margin-top: 12px;
            padding: 10px;
            background: rgba(88, 101, 242, 0.15);
            border-radius: 10px;
            border: 1px solid rgba(88, 101, 242, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .discord-widget:hover {
            background: rgba(88, 101, 242, 0.25);
            border-color: rgba(88, 101, 242, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(88, 101, 242, 0.3);
        }

        .discord-widget:active {
            transform: translateY(0);
        }

        .discord-status {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            font-size: 0.9em;
        }

        .discord-icon {
            font-size: 18px;
            color: #5865F2;
            animation: discord-pulse 2s ease-in-out infinite;
        }

        @keyframes discord-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .discord-link-hint {
            font-size: 0.75em;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 3px;
            display: block;
        }

        .music-player {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 20px 30px;
            box-shadow: 0 8px 32px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: slideIn 0.8s ease-out 0.2s backwards;
            position: relative;
            transition: transform 0.3s ease;
        }

        .music-content {
            display: flex;
            align-items: center;
            gap: 25px;
            width: 100%;
        }

        .music-header {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
        }

        .album-art {
            width: 70px;
            height: 70px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .album-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .album-art.playing {
            animation: rotate-album 10s linear infinite;
        }

        @keyframes rotate-album {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .song-info {
            flex-shrink: 0;
            min-width: 180px;
            max-width: 220px;
        }

        .song-title {
            font-size: 1em;
            color: #fff;
            margin-bottom: 4px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-title .spotify-badge {
            display: inline-block;
            background: #1DB954;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7em;
            margin-left: 5px;
            vertical-align: middle;
        }

        .artist-name {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
            min-width: 0;
        }

        .progress-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .time-stamps {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8em;
            white-space: nowrap;
            flex-shrink: 0;
            min-width: 38px;
            text-align: center;
        }

        .progress-bar {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: visible;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            width: 0%;
            transition: width 0.1s linear;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .control-btn {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
        }

        .control-btn:hover {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
        }

        .play-btn {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.2);
            border-color: #fff;
            font-size: 16px;
        }

        .play-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        .volume-control {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 0;
            color: rgba(255, 255, 255, 0.8);
            z-index: 100;
        }

        .volume-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 18px;
        }

        .volume-icon:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #fff;
        }

        .volume-slider-container {
            width: 0;
            overflow: hidden;
            transition: width 0.3s ease;
            margin-left: 5px;
        }

        .volume-control:hover .volume-slider-container {
            width: 100px;
        }

        .volume-slider {
            width: 100px;
            height: 4px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            -webkit-appearance: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        @media (max-width: 768px) {
            .profile-card {
                flex-direction: column;
                text-align: center;
            }

            .social-icons {
                justify-content: center;
            }

            .music-content {
                flex-direction: column;
                gap: 15px;
            }

            .music-header {
                width: 100%;
                justify-content: center;
            }

            .player-controls {
                width: 100%;
            }

            .song-info {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-content" onclick="enterSite()">
            <div class="welcome-text">Click Here</div>
            <div class="welcome-hint">to enter profile</div>

    <div class="stars" id="stars"></div>
    
    <div class="volume-control">

        <div class="volume-slider-container">

        </div>
    </div>
    
    <div class="container">
        <div class="profile-card">

                    _khoalo_ <span class="badge">ZYO</span>

                <div class="social-icons">
                    <div class="social-icon" title="Discord">
                        <i class="fab fa-discord"></i>
                    </div>
                    <div class="social-icon" title="Facebook">
                        <i class="fab fa-facebook-f"></i>
                    </div>
                    <div class="social-icon" title="Instagram">
                        <i class="fab fa-instagram"></i>
                    </div>
                    <div class="social-icon" title="TikTok">
                        <i class="fab fa-tiktok"></i>
                    </div>
                    <div class="social-icon" title="Spotify">
                        <i class="fab fa-spotify"></i>
                    </div>
                    <div class="social-icon" title="Roblox">
                        <i class="fas fa-gamepad"></i>
                    </div>
                </div>
                
                <div class="info-item">
                    <i class="fas fa-heart" id="likeIcon" onclick="toggleLike()"></i> <span id="likeCount">1</span> | 
                    <i class="fas fa-eye"></i> <span id="viewCount">52</span>

                <div class="info-item">
                    <i class="fas fa-map-marker-alt"></i> Quy Nhơn - Gia Lai - VietNam
                </div>

                <div class="discord-widget" id="discordWidget">
                    <div class="discord-status">
                        <i class="fab fa-discord discord-icon"></i>
                        <div>
                            <span id="discordStatus">Loading...</span>
                            <span class="discord-link-hint">Click to copy Discord username</span>
                        </div>

                    <div id="discordActivity" style="font-size: 0.8em; color: rgba(255,255,255,0.6); margin-top: 5px; display: none;"></div>
                </div>
            </div>
        </div>
        
        <div class="music-player">
            <div class="music-content">
                <div class="music-header">
                    <div class="album-art" id="albumArt">🎵</div>
                    <div class="song-info">
                        <div class="song-title" id="songTitle">No song playing</div>
                        <div class="artist-name" id="artistName">Connect Spotify or add music</div>
                    </div>
                </div>
                
                <div class="player-controls">
                    <span class="time-stamps" id="currentTime">0:01</span>
                    
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    
                    <span class="time-stamps" id="duration">3:46</span>
                </div>
                
                <div class="controls">
                    <button class="control-btn" id="prevBtn">
                        <i class="fas fa-step-backward"></i>
                    </button>
                    <button class="control-btn play-btn" id="playBtn">
                        <i class="fas fa-play"></i>
                    </button>
                    <button class="control-btn" id="nextBtn">
                        <i class="fas fa-step-forward"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <audio id="audioPlayer" src=""></audio>

                artist: 'Unknown Artist',
                albumArt: '', // Link ảnh album (optional)
                src: 'https://files.catbox.moe/example.mp3' // ← THAY LINK NHẠC VÀO ĐÂY
            },
            {
                title: 'Song 2',
                artist: 'Artist 2',
                albumArt: '',
                src: '' // Thêm bài thứ 2 (optional)
            }
        ];
        // ========================================================

        // Welcome screen
        function enterSite() {
            document.body.classList.add('show-content');
            incrementViews();
            
            // Auto play music when entering site
            setTimeout(() => {
                if (audioPlayer.src && MANUAL_PLAYLIST[0].src) {
                    audioPlayer.play().then(() => {
                        isPlaying = true;
                        playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                        albumArt.classList.add('playing');
                    }).catch(err => {
                        console.log('Autoplay prevented:', err);
                        // Some browsers block autoplay, that's ok
                    });
                }
            }, 1000);
            
            // Send notification to Discord (if webhook is set)
            if (DISCORD_WEBHOOK_URL) {
                sendDiscordNotification();
            }
        }

        // Send notification to Discord webhook
        async function sendDiscordNotification() {
            try {
                await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        embeds: [{
                            title: "👀 Someone visited your profile!",
                            description: `A visitor just entered your profile page.`,
                            color: 5814783,
                            timestamp: new Date(),
                            footer: {
                                text: "Profile Visitor Notification"
                            }
                        }]
                    })
                });
            } catch (error) {
                console.log('Could not send Discord notification:', error);
            }
        }

        // View counter
        function incrementViews() {
            const viewCountEl = document.getElementById('viewCount');
            let currentViews = parseInt(viewCountEl.textContent);
            currentViews++;
            viewCountEl.textContent = currentViews;
            
            // Save to storage if needed
            localStorage.setItem('profileViews', currentViews);
        }

        // Like button
        let isLiked = localStorage.getItem('isLiked') === 'true';
        const likeIcon = document.getElementById('likeIcon');
        const likeCountEl = document.getElementById('likeCount');
        
        if (isLiked) {
            likeIcon.classList.add('liked');
        }

        function toggleLike() {
            isLiked = !isLiked;
            let currentLikes = parseInt(likeCountEl.textContent);
            
            if (isLiked) {
                currentLikes++;
                likeIcon.classList.add('liked');
                localStorage.setItem('isLiked', 'true');
            } else {
                currentLikes--;
                likeIcon.classList.remove('liked');
                localStorage.setItem('isLiked', 'false');
            }
            
            likeCountEl.textContent = currentLikes;
            localStorage.setItem('profileLikes', currentLikes);
        }

        // Load saved counts
        const savedViews = localStorage.getItem('profileViews');
        const savedLikes = localStorage.getItem('profileLikes');
        if (savedViews) document.getElementById('viewCount').textContent = savedViews;
        if (savedLikes) likeCountEl.textContent = savedLikes;

        // Generate stars with more sparkle effect
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 200; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            const size = Math.random() * 4 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.animationDelay = Math.random() * 3 + 's';
            star.style.animationDuration = (Math.random() * 2 + 2) + 's';
            starsContainer.appendChild(star);
        }

        // Music Player
        const audioPlayer = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeIcon = document.getElementById('volumeIcon');
        const albumArt = document.getElementById('albumArt');

        let isPlaying = false;
        let currentSongIndex = 0;

        // Mouse move tilt effect for entire container
        const container = document.querySelector('.container');
        
        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = (y - centerY) / 15;
            const rotateY = (centerX - x) / 15;
            
            container.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });
        
        container.addEventListener('mouseleave', () => {
            container.style.transform = 'perspective(1000px) rotateX(0) rotateY(0)';
        });

        // Playlist - Thêm link nhạc của bạn vào đây
        const playlist = [
            {
                title: 'haydeanhduoccungemdau',
                artist: 'Unknown Artist',
                src: 'https://files.catbox.moe/53ow06.mp3' // Thêm link nhạc ở đây
            },
            {
                title: 'Song 2',
                artist: 'Artist 2',
                src: '' // Thêm link nhạc ở đây
            }
        ];

        function loadSong(index) {
            const song = playlist[index];
            document.getElementById('songTitle').textContent = song.title;
            audioPlayer.src = song.src;
        }

        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                audioPlayer.pause();
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                albumArt.classList.remove('playing');
            } else {
                audioPlayer.play();
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                albumArt.classList.add('playing');
            }
            isPlaying = !isPlaying;
        });

        prevBtn.addEventListener('click', () => {
            currentSongIndex = (currentSongIndex - 1 + playlist.length) % playlist.length;
            loadSong(currentSongIndex);
            if (isPlaying) audioPlayer.play();
        });

        nextBtn.addEventListener('click', () => {
            currentSongIndex = (currentSongIndex + 1) % playlist.length;
            loadSong(currentSongIndex);
            if (isPlaying) audioPlayer.play();
        });

        audioPlayer.addEventListener('timeupdate', () => {
            const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            progressFill.style.width = progress + '%';
            
            const minutes = Math.floor(audioPlayer.currentTime / 60);
            const seconds = Math.floor(audioPlayer.currentTime % 60);
            currentTimeEl.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
        });

        progressBar.addEventListener('click', (e) => {
            const width = progressBar.clientWidth;
            const clickX = e.offsetX;
            const duration = audioPlayer.duration;
            audioPlayer.currentTime = (clickX / width) * duration;
        });

        volumeSlider.addEventListener('input', (e) => {
            const volume = e.target.value;
            audioPlayer.volume = volume / 100;
            
            // Update volume icon
            if (volume == 0) {
                volumeIcon.innerHTML = '<i class="fas fa-volume-mute"></i>';
            } else if (volume < 50) {
                volumeIcon.innerHTML = '<i class="fas fa-volume-down"></i>';
            } else {
                volumeIcon.innerHTML = '<i class="fas fa-volume-up"></i>';
            }
        });

        audioPlayer.addEventListener('ended', () => {
            nextBtn.click();
        });

        // Discord Status Simulation
        const statusIndicator = document.getElementById('statusIndicator');
        const discordStatus = document.getElementById('discordStatus');
        
        const statuses = [
            { class: 'online', text: 'Online', color: '#43b581' },
            { class: 'idle', text: 'Currently Idle', color: '#faa61a' },
            { class: 'dnd', text: 'Do Not Disturb', color: '#f04747' },
            { class: 'offline', text: 'Offline', color: '#747f8d' }
        ];

        let currentStatus = 1;

        setInterval(() => {
            currentStatus = Math.floor(Math.random() * statuses.length);
            const status = statuses[currentStatus];
            statusIndicator.className = 'status-indicator ' + status.class;
            discordStatus.textContent = status.text;
        }, 10000);

        loadSong(0);

        // Discord widget click
        const discordWidget = document.getElementById('discordWidget');
        
        discordWidget.addEventListener('click', () => {
            // Hiệu ứng click
            discordWidget.style.transform = 'scale(0.95)';
            setTimeout(() => {
                discordWidget.style.transform = '';
            }, 200);
            
            // Copy username to clipboard
            navigator.clipboard.writeText(DISCORD_USERNAME).then(() => {
                const originalText = document.getElementById('discordStatus').textContent;
                document.getElementById('discordStatus').textContent = '✓ Username copied!';
                setTimeout(() => {
                    fetchDiscordStatus(); // Reload status
                }, 2000);
            });
        });

        // Social icons click effect
        document.querySelectorAll('.social-icon').forEach(icon => {
            icon.addEventListener('click', function() {
                this.style.transform = 'scale(0.9)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 200);
            });
        });
    </script>
</body>
</html>
